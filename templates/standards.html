{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Telecommunication Standards</h1>
    <a href="{% url 'add_standard' %}" class="add-button">
        + Add Standard
    </a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for standard in standards %}
        <tr>
            <td>{{ standard.id }}</td>
            <td>{{ standard.name }}</td>
            <td>{{ standard.description }}</td>
            <td>
                <a class="edit"
                   href="{% url 'edit_standard' standard.id %}">Edit</a>

                <form method="POST"
                      action="{% url 'delete_standard' standard.id %}">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No standards found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
