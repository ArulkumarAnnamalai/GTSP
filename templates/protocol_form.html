{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>{% if protocol %}Edit Protocol{% else %}Add Protocol{% endif %}</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Protocol Name</label>
        <input type="text" name="name"
               value="{{ protocol.name|default:'' }}" required>

        <label>Description</label>
        <textarea name="description" required>{{ protocol.description|default:'' }}</textarea>

        <button type="submit">Save Protocol</button>
    </form>
</div>
{% endblock %}
