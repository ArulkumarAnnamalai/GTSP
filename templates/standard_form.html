{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>
        {% if standard %}Edit Standard{% else %}Add Standard{% endif %}
    </h2>

    <form method="POST">
        {% csrf_token %}

        <label>Standard Name</label>
        <input type="text" name="name"
               value="{{ standard.name|default:'' }}" required>

        <label>Description</label>
        <textarea name="description" required>{{ standard.description|default:'' }}</textarea>

        <button type="submit">Save Standard</button>
    </form>
</div>
{% endblock %}
